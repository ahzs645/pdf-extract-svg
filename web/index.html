<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to SVG</title>
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <div id="drop-zone" class="drop-zone">
    <div class="drop-zone-content">
      <svg class="drop-icon" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="18" x2="12" y2="12"/>
        <polyline points="9 15 12 12 15 15"/>
      </svg>
      <p class="drop-text">Drop a PDF here or click to browse</p>
      <p class="drop-hint">Your file stays in the browser — nothing is uploaded</p>
    </div>
  </div>

  <!-- File input lives outside drop zone to avoid click-event conflicts -->
  <input type="file" id="file-input" accept="application/pdf,.pdf" hidden>

  <div id="app" class="app hidden">
    <div class="toolbar">
      <button id="open-btn" title="Open another PDF">Open PDF</button>

      <div class="toolbar-separator"></div>

      <button id="prev-btn" disabled title="Previous page (Left arrow)">&larr; Prev</button>
      <span class="page-info">
        Page
        <input type="number" id="page-input" min="1" value="1" title="Jump to page">
        / <span id="page-count">--</span>
      </span>
      <button id="next-btn" disabled title="Next page (Right arrow)">Next &rarr;</button>

      <div class="toolbar-separator"></div>

      <div class="mode-switch" title="How clicking and dragging selects">
        <button id="region-mode-btn" class="mode-btn active" title="Drag a rectangle; click an image to grab it">Region</button>
        <button id="object-mode-btn" class="mode-btn" title="Click individual objects on the page">Object</button>
      </div>

      <div class="toolbar-separator"></div>

      <div class="zoom-controls" title="Pinch to zoom, or Ctrl/Cmd + scroll">
        <button id="zoom-out-btn" class="icon-btn" title="Zoom out (Ctrl/Cmd -)">&minus;</button>
        <button id="zoom-reset-btn" class="zoom-level" title="Reset zoom (Ctrl/Cmd 0)">150%</button>
        <button id="zoom-in-btn" class="icon-btn" title="Zoom in (Ctrl/Cmd +)">+</button>
      </div>

      <div class="toolbar-separator"></div>

      <button id="download-btn" disabled>Download Selection</button>
      <button id="edit-btn" disabled title="Open the selection in the vector editor">Edit vectors</button>

      <label class="toggle-label" title="Export text as outlines. Larger, but renders identically without the original fonts.">
        <input type="checkbox" id="text-mode-toggle">
        Text as outlines
      </label>

      <label class="toggle-label" title="Outline images found on the page; click one to select it">
        <input type="checkbox" id="images-toggle" checked>
        Detect images
      </label>

      <label class="toggle-label" title="Tint raster images that won't export as vector SVG">
        <input type="checkbox" id="tint-toggle">
        Highlight rasters
      </label>

      <span class="status" id="status-text">Drag to select a region</span>
    </div>

    <div class="workspace">
      <div id="pdf-viewport">
        <div id="pdf-container">
          <canvas id="pdf-canvas"></canvas>
          <div id="image-layer"></div>
          <div id="object-layer" class="hidden"></div>
          <div id="selection-layer"></div>
          <div id="selection-box"></div>
        </div>
      </div>

      <aside id="library" class="library">
        <div class="library-header">
          <h2>Library <span id="library-count" class="badge">0</span></h2>
          <div class="library-header-actions">
            <button id="export-all-btn" class="small-btn" disabled title="Download every selection as one zip">Export all</button>
            <button id="clear-all-btn" class="small-btn secondary" disabled title="Remove every selection">Clear</button>
          </div>
        </div>
        <p id="library-empty" class="library-hint">
          Drag a region on the page to add it here. Each entry previews the
          actual SVG that will be exported.
        </p>
        <div id="library-list" class="library-list"></div>

        <section id="objects-panel" class="objects-panel hidden">
          <div class="objects-header">
            <h3>Objects <span id="objects-count" class="badge">0</span></h3>
            <div class="library-header-actions">
              <button id="drop-rasters-btn" class="small-btn secondary" disabled title="Hide every raster image, leaving only what scales losslessly">Drop rasters</button>
              <button id="show-all-btn" class="small-btn secondary" disabled title="Un-hide every object in this selection">Show all</button>
            </div>
          </div>
          <p id="objects-summary" class="objects-summary"></p>
          <div id="objects-list" class="objects-list"></div>
        </section>
      </aside>
    </div>
  </div>

  <div id="editor-overlay" class="editor-overlay hidden">
    <div class="editor-shell">
      <header class="editor-header">
        <div>
          <h2>Vector editor</h2>
          <p id="editor-title" class="editor-subtitle"></p>
        </div>
        <div class="editor-actions">
          <button id="editor-delete-btn" class="small-btn secondary" disabled title="Delete the selected shape (Delete)">Delete shape</button>
          <button id="editor-undo-btn" class="small-btn secondary" disabled title="Undo the last delete (Ctrl/Cmd Z)">Undo</button>
          <button id="editor-cancel-btn" class="small-btn secondary" title="Discard these edits (Esc)">Cancel</button>
          <button id="editor-done-btn" class="small-btn" title="Apply these edits to the selection">Done</button>
        </div>
      </header>
      <div class="editor-body">
        <div id="editor-stage" class="editor-stage"></div>
        <aside class="editor-layers">
          <div class="editor-layers-header">
            <h3>Layers</h3>
            <span id="editor-count" class="editor-subtitle"></span>
          </div>
          <label class="toggle-label editor-filter" title="MuPDF writes the whole page; hide everything that falls outside this crop">
            <input type="checkbox" id="editor-inview-toggle" checked>
            Only shapes in the crop
          </label>
          <div id="editor-list" class="editor-list"></div>
        </aside>
      </div>
    </div>
  </div>
</body>
</html>
